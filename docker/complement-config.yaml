serverName: SERVER_NAME
signingKeys:
  ed25519:20240101:
    path: ed25519-active
database:
  rooms:
    transactionTimeout: 15000
    transactionRetryLimit: 100
  accounts:
    transactionTimeout: 15000
    transactionRetryLimit: 100
  transient:
    transactionTimeout: 15000
    transactionRetryLimit: 100
  media:
    transactionTimeout: 15000
    transactionRetryLimit: 100
  system:
    transactionTimeout: 15000
    transactionRetryLimit: 100
routes:
  servers:
    - listenAddr: 0.0.0.0:8008
      serviceGroups:
        - client
    - listenAddr: 0.0.0.0:8448
      tlsKeyPath: SERVER_NAME.key
      tlsCertPath: SERVER_NAME.crt
      serviceGroups:
        - client  # needed for versions endpoint
        - federation
notifier:
  redisAddr:
rooms:
  enabled: true
  defaultVersion: 11
accounts:
  enabled: true
transient:
  enabled: true
federation:
  maxFetchMissingEvents: 1000
  # Complement gets mad if we hit the profile endpoint when it's not listening for it
  fetchProfileForMemberEvents: false
secretSwitches:
  enableFederatedSendRoomCreate: true
  autoCreateDatastoreBuckets: true
media:
  enabled: true
  presignedURLTimeout: 15m
  datastores:
    minioplay:
      type: s3
      enabled: true
      bucket: babbleserv-dev
      endpoint: play.min.io
      accessKeyID: Q3AM3UQ867SPQQA43P2F
